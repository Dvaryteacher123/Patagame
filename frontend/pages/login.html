<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - DVARY GAMES</title>
    
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"
            }
        }
    </script>
    
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ============================================
    FIREBASE INITIALIZATION
    ============================================ -->
    <script type="module">
        // ============================================
        // IMPORT FIREBASE SDKs
        // ============================================
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        import { getAuth } from "firebase/auth";
        import { getFirestore } from "firebase/firestore";
        import { getStorage } from "firebase/storage";

        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };

        // ============================================
        // INITIALIZE FIREBASE
        // ============================================
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        console.log('🔥 Firebase initialized in login.html!');

        window.__firebase = { app, analytics, auth, db, storage };
    </script>

    <!-- ============================================
    LOGIN PAGE
    ============================================ -->
    <div class="auth-page">
        <a href="index.html" class="auth-back-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-gamepad"></i>
                <span>DVARY</span> GAMES
            </div>
            
            <h1 class="auth-title">Welcome Back!</h1>
            <p class="auth-subtitle">Login to continue your gaming journey</p>
            
            <form id="loginForm" class="auth-form" autocomplete="off">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                    <div class="form-error" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required />
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" id="passwordError"></div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" />
                        <span class="checkmark"></span>
                        Remember Me
                    </label>
                    <a href="#" class="forgot-password" id="forgotPassword">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-primary auth-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                
                <div class="auth-loading" id="authLoading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Logging in...</p>
                </div>
                
                <div class="auth-error" id="authError" style="display: none;"></div>
                
                <div class="auth-divider"><span>or</span></div>
                
                <div class="auth-footer">
                    <p>Don't have an account? <a href="signup.html" class="auth-link">Create Account</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================
    AUTH.JS
    ============================================ -->
    <script type="module" src="../js/auth.js"></script>

</body>
</html>
